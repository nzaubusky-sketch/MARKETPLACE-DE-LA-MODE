<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes commandes</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand" href="index.html">MODE<span>MARKET</span></a><nav><a href="catalogue.html">Catalogue</a><a href="index.html">Accueil</a></nav></header><main class="section"><p class="eyebrow">ESPACE CLIENT</p><h1>Mes commandes</h1><div id="orders"></div></main><script src="js/app.js"></script><script>const u=requireLogin();const box=document.getElementById('orders');const orders=getOrders().filter(o=>o.customer&&o.customer.email===u.email);box.innerHTML=orders.length?orders.reverse().map(o=>`<article class="order-card"><strong>${o.orderNumber||o.id}</strong><span>${money(o.total)}</span><span>${o.status}</span><small>${formatDate(o.createdAt)}</small></article>`).join(''):'<div class="empty">Aucune commande pour le moment.</div>';</script></body></html>
