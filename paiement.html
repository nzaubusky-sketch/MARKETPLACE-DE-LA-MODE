<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paiement</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand" href="index.html">MODE<span>MARKET</span></a></header><main class="auth"><div class="auth-card"><p class="eyebrow">PAIEMENT DÉMO</p><h1 id="amount">0 $</h1><p>Cette version utilise un paiement simulé pour la démonstration.</p><button class="btn primary" onclick="pay()">Confirmer le paiement</button></div></main><script src="js/app.js"></script><script>requireLogin();const o=JSON.parse(localStorage.getItem('pendingOrder')||'null');if(!o)location.href='panier.html';document.getElementById('amount').textContent=money(o.total);function pay(){o.id=Date.now().toString();o.orderNumber='MM-'+o.id.slice(-6);o.paymentStatus='Payé';o.status='Commande confirmée';const orders=getOrders();orders.push(o);localStorage.setItem('marketOrders',JSON.stringify(orders));localStorage.removeItem('pendingOrder');localStorage.removeItem('marketCart');location.href='confirmation.html?id='+o.id;}</script></body></html>
