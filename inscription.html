<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand" href="index.html">MODE<span>MARKET</span></a></header><main class="auth"><form id="signup" class="auth-card"><p class="eyebrow">CRÉER UN COMPTE</p><h1>Bienvenue</h1><input id="name" placeholder="Nom complet" required><input id="email" type="email" placeholder="Adresse email" required><input id="password" type="password" minlength="6" placeholder="Mot de passe (6 caractères min.)" required><select id="role"><option value="client">Client</option><option value="vendeur">Vendeur</option></select><button class="btn primary">Créer mon compte</button><p>Déjà inscrit ? <a href="connexion.html">Se connecter</a></p></form></main><script src="js/app.js"></script><script>document.getElementById('signup').onsubmit=e=>{e.preventDefault();const users=getUsers();const email=document.getElementById('email').value.trim().toLowerCase();if(users.some(u=>u.email===email))return alert('Cet email existe déjà.');const u={id:Date.now().toString(),name:document.getElementById('name').value.trim(),email,password:document.getElementById('password').value,role:document.getElementById('role').value,verified:true,blocked:false,createdAt:new Date().toISOString()};users.push(u);saveUsers(users);localStorage.setItem('marketUser',JSON.stringify(u));location.href=u.role==='vendeur'?'vendeur/dashboard.html':'index.html';};</script></body></html>
