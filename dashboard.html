<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="top"><a class="brand" href="../index.html">MODE<span>MARKET</span></a><nav><a href="../catalogue.html">Catalogue</a><a href="#" onclick="logoutUser()">Déconnexion</a></nav></header><main class="section"><p class="eyebrow">ADMINISTRATION</p><h1>Tableau de bord</h1><div class="grid"><div class="auth-card"><small>Utilisateurs</small><h2 id="users">0</h2></div><div class="auth-card"><small>Produits</small><h2 id="products">0</h2></div><div class="auth-card"><small>Commandes</small><h2 id="orders">0</h2></div><div class="auth-card"><small>Commission 2,5 %</small><h2 id="commission">0 $</h2></div></div><div class="auth-card" style="width:100%;margin-top:25px"><h2>Commandes récentes</h2><div id="list"></div></div><div class="auth-card" style="width:100%;margin-top:25px"><h2>Utilisateurs</h2><div id="ulist"></div></div></main><script src="../auth.js"></script><script src="../js/app.js"></script><script>requireAdmin();function draw(){const us=getUsers(),ps=getProducts(),os=getOrders();document.getElementById('users').textContent=us.length;document.getElementById('products').textContent=ps.length;document.getElementById('orders').textContent=os.length;const sales=os.filter(o=>o.paymentStatus==='Payé').reduce((s,o)=>s+Number(o.total||0),0);document.getElementById('commission').textContent=money(sales*.025);document.getElementById('list').innerHTML=os.slice().reverse().map(o=>`<div class="order-card"><strong>${o.orderNumber||o.id}</strong><span>${money(o.total)}</span><span>${o.status}</span></div>`).join('')||'<div class="empty">Aucune commande.</div>';document.getElementById('ulist').innerHTML=us.map(u=>`<div class="order-card"><strong>${u.name}</strong><span>${u.email}</span><span>${u.role}</span></div>`).join('')}draw();</script></body></html>
