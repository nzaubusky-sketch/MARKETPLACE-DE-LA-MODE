<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand" href="index.html">MODE<span>MARKET</span></a></header><main class="auth"><form id="login" class="auth-card"><p class="eyebrow">ESPACE MEMBRE</p><h1>Connexion</h1><input id="email" type="email" placeholder="Adresse email" required><input id="password" type="password" placeholder="Mot de passe" required><button class="btn primary">Se connecter</button><p>Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p><p class="hint">Démo admin : admin@modemarket.local / admin123</p></form></main><script src="js/app.js"></script><script>seedAdmin();document.getElementById('login').onsubmit=e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const u=getUsers().find(x=>x.email===email&&x.password===password);if(!u)return alert('Email ou mot de passe incorrect.');if(u.blocked)return alert('Ce compte est bloqué.');localStorage.setItem('marketUser',JSON.stringify(u));location.href=u.role==='admin'?'admin/dashboard.html':u.role==='vendeur'?'vendeur/dashboard.html':'index.html';};</script></body></html>
