<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produit</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand" href="index.html">MODE<span>MARKET</span></a><nav><a href="catalogue.html">Catalogue</a><a href="panier.html">Panier <b id="cartCount">0</b></a></nav></header><main class="section" id="detail"></main><script src="js/app.js"></script><script>const p=getProducts().find(x=>x.id===new URLSearchParams(location.search).get('id'));if(!p)location.href='catalogue.html';else document.getElementById('detail').innerHTML=`<div class="product-detail"><img src="${p.image}" alt=""><div><p class="eyebrow">${p.category}</p><h1>${p.name}</h1><p class="price">${money(p.price)}</p><p>${p.description}</p><p>Vendeur : <strong>${p.sellerName}</strong></p><button class="btn primary" onclick="addToCart('${p.id}')">Ajouter au panier</button></div></div>`;</script></body></html>
