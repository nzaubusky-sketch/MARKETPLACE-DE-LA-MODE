<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commande</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand" href="index.html">MODE<span>MARKET</span></a></header><main class="auth"><form id="order" class="auth-card"><p class="eyebrow">FINALISATION</p><h1>Votre commande</h1><input id="name" placeholder="Nom complet" required><input id="phone" placeholder="Téléphone" required><input id="address" placeholder="Adresse de livraison" required><select id="payment"><option>Mobile Money</option><option>Carte bancaire</option><option>Paiement à la livraison</option></select><button class="btn primary">Continuer vers le paiement</button></form></main><script src="js/app.js"></script><script>requireLogin();document.getElementById('order').onsubmit=e=>{e.preventDefault();const draft={id:Date.now().toString(),customer:{name:name.value,phone:phone.value,address:address.value,email:currentUser().email},products:getCart(),total:cartTotal(),paymentMethod:payment.value,status:'En attente de paiement',paymentStatus:'Non payé',createdAt:new Date().toISOString()};localStorage.setItem('pendingOrder',JSON.stringify(draft));location.href='paiement.html';};</script></body></html>
